[package]
name = "will-pixel"
version = "0.1.0"
description = "Pixel art editor for Windows"
authors = ["Wiliam Patricio"]
edition = "2021"
license = "MIT"

[lib]
# `_lib` suffix avoids a name clash with the bin on Windows (cargo#8519)
name = "will_pixel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
